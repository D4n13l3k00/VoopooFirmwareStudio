name: CI & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Release (Windows x64 MSBuild)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master
          $isOnMaster = git branch -r --contains HEAD | Where-Object { $_ -match 'origin/master' }
          if (-not $isOnMaster) {
            Write-Error "Tag $env:GITHUB_REF_NAME must be on origin/master branch!"
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build All Configurations (x64)
        run: |
          msbuild VoopooFirmwareStudio.sln /p:Configuration=Repacker /p:Platform=x64 /m /v:m
          msbuild VoopooFirmwareStudio.sln /p:Configuration=Repacker-Fonts /p:Platform=x64 /m /v:m
          msbuild VoopooFirmwareStudio.sln /p:Configuration=Repacker-Flasher /p:Platform=x64 /m /v:m
          msbuild VoopooFirmwareStudio.sln /p:Configuration=Repacker-Fonts-Flasher /p:Platform=x64 /m /v:m

      - name: Run Smoke Tests
        shell: pwsh
        run: |
          .\build\Repacker\VoopooFirmwareStudio.exe --smoke-test
          .\build\Repacker-Fonts\VoopooFirmwareStudio.exe --smoke-test
          .\build\Repacker-Flasher\VoopooFirmwareStudio.exe --smoke-test
          .\build\Repacker-Fonts-Flasher\VoopooFirmwareStudio.exe --smoke-test

      - name: Prepare release binaries
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "v1.0.0" }
          Copy-Item build/Repacker/VoopooFirmwareStudio.exe ./VoopooFirmwareStudio-$ver-Repacker.exe -Force
          Copy-Item build/Repacker-Fonts/VoopooFirmwareStudio.exe ./VoopooFirmwareStudio-$ver-Repacker-Fonts.exe -Force
          Copy-Item build/Repacker-Flasher/VoopooFirmwareStudio.exe ./VoopooFirmwareStudio-$ver-Repacker-Flasher.exe -Force
          Copy-Item build/Repacker-Fonts-Flasher/VoopooFirmwareStudio.exe ./VoopooFirmwareStudio-$ver-Repacker-Fonts-Flasher.exe -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoopooFirmwareStudio-windows-x64
          path: VoopooFirmwareStudio-*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Voopoo Firmware Studio ${{ github.ref_name }}
          files: VoopooFirmwareStudio-*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
