name: CI & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Windows x64 MSBuild)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag is on master
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          git fetch origin master
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch origin/master" }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Tag $env:GITHUB_REF_NAME must be on origin/master branch!"
            exit 1
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release (x64)
        shell: pwsh
        run: |
          $versionArgs = @()
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw "Release tag must be vMAJOR.MINOR.PATCH"
            }
            $versionArgs = @("/p:StudioVersion=$($env:GITHUB_REF_NAME.Substring(1))")
          }
          & msbuild VoopooFirmwareStudio.sln /p:Configuration=Release /p:Platform=x64 /m /v:m @versionArgs
          if ($LASTEXITCODE -ne 0) { throw "Release build failed" }

      - name: Verify Firmware Projects and Editing Tools
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\Release\VoopooFirmwareStudio.exe -ArgumentList '--project-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Project and editing tests failed with exit code $($process.ExitCode)"
          }

      - name: Verify Native UI Layouts
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\Release\VoopooFirmwareStudio.exe -ArgumentList '--layout-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Native layout tests failed with exit code $($process.ExitCode)"
          }

      - name: Verify All Native Screens and Revisions
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\Release\VoopooFirmwareStudio.exe -ArgumentList '--coverage-test=all' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Get-Content studio_debug.log
            throw "Native coverage tests failed with exit code $($process.ExitCode)"
          }

      - name: Run Smoke Tests
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\build\Release\VoopooFirmwareStudio.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Smoke tests failed with exit code $($process.ExitCode)"
          }

      - name: Prepare release binaries
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA.Substring(0, 8) }
          Copy-Item build/Release/VoopooFirmwareStudio.exe ./VoopooFirmwareStudio-$ver-Release.exe -Force
          New-Item -ItemType Directory -Force build/corresponding-source | Out-Null
          git archive --format=zip --output=build/corresponding-source/studio-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { throw "Cannot package studio sources" }
          tar -czf build/corresponding-source/unicorn-2.1.4-source.tar.gz -C build/deps unicorn-2.1.4
          if ($LASTEXITCODE -ne 0) { throw "Cannot package Unicorn sources" }
          tar -czf build/corresponding-source/xz-5.8.1-source.tar.gz -C build/deps xz-5.8.1
          if ($LASTEXITCODE -ne 0) { throw "Cannot package XZ sources" }
          Copy-Item LICENSE build/corresponding-source/MIT-LICENSE
          Copy-Item third_party/UNICORN-COPYING build/corresponding-source/UNICORN-COPYING
          Copy-Item third_party/xz.LICENSE build/corresponding-source/xz.LICENSE
          Compress-Archive -Path build/corresponding-source/* -DestinationPath "./VoopooFirmwareStudio-$ver-Source.zip" -Force
          Copy-Item third_party/UNICORN-COPYING ./UNICORN-COPYING -Force
          Copy-Item third_party/*.LICENSE ./ -Force
          Copy-Item third_party/markdown/*.LICENSE ./ -Force

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VoopooFirmwareStudio-windows-x64
          path: |
            VoopooFirmwareStudio-*.exe
            VoopooFirmwareStudio-*-Source.zip
            UNICORN-COPYING
            *.LICENSE
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read release notes from annotated tag
        shell: bash
        run: |
          # Checkout can replace the local tag object with its peeled commit.
          git fetch --force origin "$GITHUB_REF:$GITHUB_REF"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          if [ "$(git cat-file -t "$GITHUB_REF")" != tag ]; then
            echo "Release requires an annotated tag containing release notes." >&2
            exit 1
          fi
          git for-each-ref --format='%(contents)' "$GITHUB_REF" > "$RUNNER_TEMP/release-notes.md"
          test -s "$RUNNER_TEMP/release-notes.md"

      - name: Download verified binaries
        uses: actions/download-artifact@v4
        with:
          name: VoopooFirmwareStudio-windows-x64

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Voopoo Firmware Studio ${{ github.ref_name }}
          files: |
            VoopooFirmwareStudio-*.exe
            VoopooFirmwareStudio-*-Source.zip
            UNICORN-COPYING
            *.LICENSE
          body_path: ${{ runner.temp }}/release-notes.md
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
